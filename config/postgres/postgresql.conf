# Only non-default settings; everything else uses PostgreSQL's built-in defaults.
# Host network (like a native install on the server): only local clients
listen_addresses = 'localhost'

# TimescaleDB must be preloaded. The base image's init scripts would put it into $PGDATA/postgresql.conf,
# which this server doesn't read (config_file): everything is set here.
shared_preload_libraries = 'timescaledb,pg_stat_statements,pg_tracing'
timescaledb.telemetry_level = off

# pg_stat_statements
pg_stat_statements.track = all
compute_query_id = on

# Log every statement that runs for >= 1s
log_min_duration_statement = 1000

# Structured JSON logs to a volume shared with Alloy
logging_collector = on
log_destination = 'jsonlog'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'   # jsonlog writes *.json
log_file_mode = 0644

# pg_tracing: spans -> OTLP/HTTP (JSON) -> Alloy sidecar
pg_tracing.otel_endpoint = 'http://127.0.0.1:14318/v1/traces'
pg_tracing.otel_naptime = 2000                # ms between exports
pg_tracing.otel_service_name = 'fish-postgres'   # service.name: same as logs, profiles, metrics (job)
pg_tracing.caller_sample_rate = 1.0           # honour sampled /*traceparent='...'*/ (sqlcommenter)
pg_tracing.sample_rate = 0.0                  # only trace queries whose caller sampled them (traceparent)
pg_tracing.max_span = 10000
