# Only non-default settings; everything else uses PostgreSQL's built-in defaults.
listen_addresses = '*'

# pg_stat_statements
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
compute_query_id = on

# Log every statement that runs for >= 1s
log_min_duration_statement = 1000

# Structured JSON logs to a volume shared with Alloy
logging_collector = on
log_destination = 'jsonlog'
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'   # jsonlog writes *.json
log_file_mode = 0644
