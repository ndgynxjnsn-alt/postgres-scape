# PostgreSQL 18 + Grafana Alloy sidecar -> Mimir (metrics) / Loki (logs) / Grafana
#   docker compose up -d
#   Grafana: http://localhost:3001 (anonymous admin)
#   Slow query test: docker compose exec postgres psql -U postgres -c 'SELECT pg_sleep(1.5)'

name: postgres-scrape

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    configs:
      - source: pg_conf
        target: /etc/postgresql/postgresql.conf
      - source: pg_init
        target: /docker-entrypoint-initdb.d/01-pg_stat_statements.sql
    volumes:
      - pgdata:/var/lib/postgresql
      - pglogs:/var/log/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

  alloy:
    image: grafana/alloy:v1.21.2
    # Host namespaces so node metrics (network, processes) describe the server, not the container.
    # Consequently Alloy reaches postgres/mimir/loki via their published ports on localhost.
    network_mode: host
    pid: host
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=public-preview   # otelcol.receiver.filelog
      - /etc/alloy/config.alloy
    configs:
      - source: alloy
        target: /etc/alloy/config.alloy
    volumes:
      - pglogs:/var/log/postgresql:ro
      - /:/host:ro,rslave
      - /run/systemd:/run/systemd:ro   # systemd collector (private D-Bus socket)
      - /run/udev:/run/udev:ro         # diskstats device properties
      - alloydata:/var/lib/alloy/data
    depends_on:
      postgres: { condition: service_healthy }
      mimir: { condition: service_started }
      loki: { condition: service_started }

  # ---- test backends -------------------------------------------------------

  mimir:
    image: grafana/mimir:3.2.3
    command: ["-config.file=/etc/mimir.yaml"]
    configs:
      - source: mimir
        target: /etc/mimir.yaml
    ports:
      - "127.0.0.1:9009:9009"

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yaml
    ports:
      - "3001:3000"
    depends_on: [mimir, loki]

volumes:
  pgdata:
  pglogs:
  alloydata:

configs:
  pg_conf:
    file: ./config/postgres/postgresql.conf
  pg_init:
    file: ./config/postgres/init.sql
  alloy:
    file: ./config/alloy/config.alloy
  mimir:
    file: ./config/mimir/mimir.yaml
  grafana_datasources:
    file: ./config/grafana/datasources.yaml
