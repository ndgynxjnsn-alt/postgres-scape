# PostgreSQL 18 (pg_stat_statements, pg_tracing, slow query log) + Grafana Alloy sidecar
# shipping metrics, logs, traces and eBPF profiles to graf_zahl (../graf_zahl).
#   (cd ../graf_zahl && docker compose up -d)   # backends + Grafana on :3000
#   docker compose up -d --build
#   Slow query test: docker compose exec postgres psql -U postgres -c 'SELECT pg_sleep(1.5)'
#
# Both containers use the host network, like a native install on the Ubuntu server:
# Postgres listens on localhost:5432, Alloy reaches it and graf_zahl via localhost.

name: postgres-scrape

services:
  postgres:
    build: ./postgres   # postgres:18.6 + pg_tracing
    image: postgres-scrape-postgres:local
    network_mode: host
    environment:
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    configs:
      - source: pg_conf
        target: /etc/postgresql/postgresql.conf
      - source: pg_init
        target: /docker-entrypoint-initdb.d/01-extensions.sql
    volumes:
      - pgdata:/var/lib/postgresql
      - pglogs:/var/log/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      retries: 10

  alloy:
    image: grafana/alloy:v1.21.2
    # Host namespaces so node metrics (network, processes) describe the server, not the container,
    # and so pyroscope.ebpf sees the Postgres processes.
    network_mode: host
    pid: host
    privileged: true   # pyroscope.ebpf loads BPF programs
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12346   # graf_zahl's Alloy owns :12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=public-preview   # otelcol.receiver.filelog
      - /etc/alloy/config.alloy
    configs:
      - source: alloy
        target: /etc/alloy/config.alloy
    volumes:
      - pglogs:/var/log/postgresql:ro
      - /:/host:ro,rslave              # node metrics; Docker socket for eBPF target discovery
      - /run/systemd:/run/systemd:ro   # systemd collector (private D-Bus socket)
      - /run/udev:/run/udev:ro         # diskstats device properties
      - alloydata:/var/lib/alloy/data
    depends_on:
      postgres: { condition: service_healthy }

  # ---- demo client: its traces continue into pg_tracing's spans ------------

  app:
    build: ./app   # Spring Boot + OTel Java agent, http://localhost:8090/books
    image: postgres-scrape-app:local
    network_mode: host
    environment:
      OTEL_SERVICE_NAME: pg-client
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318   # graf_zahl's Alloy
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      # Appends /*traceparent='...'*/ to every statement; pg_tracing makes its spans children of the JDBC span
      OTEL_INSTRUMENTATION_JDBC_EXPERIMENTAL_SQLCOMMENTER_ENABLED: "true"
    depends_on:
      postgres: { condition: service_healthy }

  load:
    image: curlimages/curl:8.17.0
    network_mode: host
    entrypoint: ["sh", "-c"]
    command:
      - |
        until curl -sf localhost:8090/books >/dev/null; do sleep 2; done
        while :; do
          curl -s localhost:8090/books >/dev/null
          curl -s localhost:8090/books/$$((RANDOM % 6 + 1)) >/dev/null   # id 6 -> 500
          [ $$((RANDOM % 5)) -eq 0 ] && curl -s localhost:8090/report >/dev/null
          sleep 1
        done
    depends_on: [app]

volumes:
  pgdata:
  pglogs:
  alloydata:

configs:
  pg_conf:
    file: ./config/postgres/postgresql.conf
  pg_init:
    file: ./config/postgres/init.sql
  alloy:
    file: ./config/alloy/config.alloy
