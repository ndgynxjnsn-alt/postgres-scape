apiVersion: 1

# Multi-tenant backends: every datasource reads tenant "fish" (X-Scope-OrgID).

datasources:
  # ---- Metrics (Mimir, Prometheus-compatible) ----
  - name: Mimir
    uid: mimir
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    jsonData:
      httpHeaderName1: X-Scope-OrgID
      httpMethod: POST
      manageAlerts: false
      prometheusType: Mimir
      # Turn metric exemplars into clickable links to Tempo traces.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
          urlDisplayLabel: "View trace"

  # ---- Traces (Tempo) ----
    secureJsonData:
      httpHeaderValue1: fish
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpHeaderName1: X-Scope-OrgID
      # Dashboard trace-search panels stream results over Grafana Live; Tempo
      # serves that because stream_over_http_enabled is on in tempo-config.yml.
      streamingEnabled:
        search: true
        metrics: true
      # Trace span -> jump to correlated logs in Loki. filterByTraceID adds
      # the span's trace id to the query; the tag maps the span's service.name
      # onto the Loki `service_name` stream selector, so the button on each span
      # runs {service_name="graf-zahl-demo"} | trace_id="<id>".
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        tags:
          - key: service.name
            value: service_name
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
      # Trace span -> related RED metrics in Mimir
      tracesToMetrics:
        datasourceUid: mimir
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
      tracesToProfiles:
        datasourceUid: pyroscope
        profileTypeId: "process_cpu:cpu:nanoseconds:cpu:nanoseconds"

  # ---- Logs (Loki) ----
    secureJsonData:
      httpHeaderValue1: fish
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      httpHeaderName1: X-Scope-OrgID
      # trace_id arrives as OTLP structured metadata -> link it to Tempo.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "${__value.raw}"
          urlDisplayLabel: "View trace"

  # ---- Profiles (Pyroscope) ----
    secureJsonData:
      httpHeaderValue1: fish
  - name: Pyroscope
    uid: pyroscope
    type: grafana-pyroscope-datasource
    access: proxy
    url: http://pyroscope:4040
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: fish
