# TimescaleDB/PostgreSQL 18 (pg_stat_statements, pg_tracing, slow query log) + Grafana Alloy sidecar,
# shipping metrics, logs, traces and eBPF profiles to the central Alloy of the LGTM stack in graf_zahl/.
#
#   graf_zahl/certs/generate.sh          # once: root CA + certificate for alloy.org
#   docker compose up -d --build
#   Grafana: http://localhost:3001
#
# Shared names (tenant, service name, container name): .env
# Config files are bind-mounted: edit, then restart the service (docker compose restart alloy-sidecar).
#
# PostgreSQL and the sidecar use the host network, like a native install on the Ubuntu server:
# Postgres listens on localhost:5432, the sidecar reaches it on localhost.
# alloy.org is pinned to 127.0.0.1 (extra_hosts), where Traefik publishes the central Alloy on :443. The host's
# /etc/hosts maps it to the lab VM; containers get their own hosts file, so that doesn't apply here.

name: postgres-scrape

include:
  - graf_zahl/docker-compose.yml   # central Alloy, Loki, Mimir, Tempo, Pyroscope, Grafana

x-central-alloy-host: &central-alloy-host
  extra_hosts:
    - "alloy.org:127.0.0.1"

services:
  postgresdata:
    build: ./postgres   # timescale/timescaledb:2.24.0-pg18 + pg_tracing (BASE_IMAGE: see the Dockerfile)
    image: postgres-scrape-postgres:local
    container_name: ${PG_CONTAINER}
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_PASSWORD: postgres
      # The base image's init scripts would write tuning and telemetry into $PGDATA/postgresql.conf,
      # which this server doesn't read (config_file): all settings live in config/postgres/postgresql.conf
      NO_TS_TUNE: "true"
      TIMESCALEDB_TELEMETRY: "off"
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - pg_tracing.otel_service_name=${SERVICE_NAME}
    volumes:
      - ./config/postgres:/etc/postgresql:ro
      - ./config/postgres/initdb/010_extensions.sql:/docker-entrypoint-initdb.d/010_extensions.sql:ro
      # PG18 layout: the data directory is /var/lib/postgresql/18/docker (PGDATA) inside this volume.
      # Don't mount at /var/lib/postgresql/data: the image has a symlink there (data -> .), so Docker
      # mounts at /var/lib/postgresql anyway. Existing data volume: upgrading.md
      - postgresdata:/var/lib/postgresql
      - postgreslogs:/var/log/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      retries: 10

  alloy-sidecar:
    image: grafana/alloy:v1.21.2
    restart: unless-stopped
    # Host namespaces so node metrics (network, processes) describe the server, not the container,
    # and so pyroscope.ebpf sees the Postgres processes.
    network_mode: host
    pid: host
    privileged: true   # pyroscope.ebpf loads BPF programs
    <<: *central-alloy-host
    environment:
      TENANT: ${TENANT}
      SERVICE_NAME: ${SERVICE_NAME}
      PG_CONTAINER: ${PG_CONTAINER}
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12346   # the original graf_zahl's Alloy owns :12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=public-preview   # otelcol.receiver.filelog, otelcol.receiver.file_stats
      - /etc/alloy                         # every *.alloy file in the directory
    volumes:
      - ./config/alloy:/etc/alloy:ro
      - ./graf_zahl/certs/ca.crt:/etc/alloy-certs/ca.crt:ro   # trusts the central Alloy
      - ./demo-logs:/var/log/fish-demo:ro                     # custom-metrics.alloy: file metrics
      - postgreslogs:/var/log/postgresql:ro
      - /:/host:ro,rslave              # node metrics, journal, Docker socket (eBPF target discovery)
      - /run/systemd:/run/systemd:ro   # systemd collector (private D-Bus socket)
      - /run/udev:/run/udev:ro         # diskstats device properties
      - alloydata:/var/lib/alloy/data
    depends_on:
      postgresdata: { condition: service_healthy }
      alloy: { condition: service_started }

  # ---- demo client: its traces continue into pg_tracing's spans ------------

  app:
    build: ./app   # Spring Boot + OTel Java agent, http://localhost:8090/books
    image: postgres-scrape-app:local
    restart: unless-stopped
    network_mode: host
    <<: *central-alloy-host
    environment:
      OTEL_SERVICE_NAME: pg-client
      OTEL_EXPORTER_OTLP_ENDPOINT: https://alloy.org
      OTEL_EXPORTER_OTLP_CERTIFICATE: /certs/ca.crt
      OTEL_EXPORTER_OTLP_HEADERS: X-Scope-OrgID=${TENANT}
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      # Appends /*traceparent='...'*/ to every statement; pg_tracing makes its spans children of the JDBC span
      OTEL_INSTRUMENTATION_JDBC_EXPERIMENTAL_SQLCOMMENTER_ENABLED: "true"
    volumes:
      - ./graf_zahl/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      postgresdata: { condition: service_healthy }

  load:
    image: curlimages/curl:8.17.0
    restart: unless-stopped
    network_mode: host
    entrypoint: ["sh", "-c"]
    command:
      - |
        until curl -sf localhost:8090/books >/dev/null; do sleep 2; done
        while :; do
          curl -s localhost:8090/books >/dev/null
          curl -s localhost:8090/books/$$((RANDOM % 6 + 1)) >/dev/null   # id 6 -> 500
          [ $$((RANDOM % 5)) -eq 0 ] && curl -s localhost:8090/report >/dev/null
          [ $$((RANDOM % 10)) -eq 0 ] && curl -s -X POST localhost:8090/catches >/dev/null
          sleep 1
        done
    depends_on: [app]

volumes:
  postgresdata:
  postgreslogs:
  alloydata:
